[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cyanoguard-calibration"
version = "0.1.0"
description = "Dual-fluorescence concentration calibration models from CyanoGuard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "pandas==3.0.3", "scipy==1.16.0"]

[project.scripts]
cyanoguard-calibrate = "cyanoguard_calibration:main"

[tool.setuptools.packages.find]
where = ["src"]
